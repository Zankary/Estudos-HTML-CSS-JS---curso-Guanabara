<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Teste JS02</title>
	<meta charset="utf-8"/>
	<script>
	    function acenderLampada() { <!--se a função acenderLampada for ativada, segue com comandos abaixo-->
		    document.getElementById("luz").src = "_imagens/lampada-acesa.jpg"; <!--transforma o que se indentifica como  ("luz") e transforma na proxima imagem com .src = "imagem"-->
		}
		function apagarLampada() {
		    document.getElementById("luz").src = "_imagens/lampada-apagada.jpg";
		}
		function quebrarLampada() {
		    document.getElementById("luz").src = "_imagens/lampada-quebrada.jpg";
		}
	</script>
</head>
<body>
    <h1>Acenda a lâmpada</h1>
	<img src="_imagens/lampada-apagada.jpg" id="luz" onmouseover="acenderLampada()" onmouseout="apagarLampada()" onclick="quebrarLampada()"/> <!--"onclick" para detectar o mouse clickando... seta o id da imagem apagada para Luz e onmouse move para fornecer o comando acenderLampada-->

</body>
</html>
